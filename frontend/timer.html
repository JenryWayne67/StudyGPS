<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>StudyGPS — Study Timer</title>
  <link rel="stylesheet" href="common.css">
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-50 font-sans text-slate-900 min-h-screen">

  <div class="app-container">
    <!-- SIDEBAR -->
    <aside class="app-sidebar">
      <a href="dashboard.html" class="brand-header">
        <div class="brand-logo">
          <svg class="w-5 h-5" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
            <circle cx="12" cy="12" r="10"></circle>
            <polygon points="16.24 7.76 14.12 14.12 7.76 16.24 9.88 9.88 16.24 7.76"></polygon>
          </svg>
        </div>
        <div class="brand-info">
          <span class="brand-name">StudyGPS</span>
          <span class="brand-subtitle">Academic OS</span>
        </div>
      </a>

      <nav class="sidebar-nav">
        <a href="dashboard.html" class="nav-link">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="m3 9 9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"></path>
            <polyline points="9 22 9 12 15 12 15 22"></polyline>
          </svg>
          Dashboard
        </a>
        <a href="materials.html" class="nav-link">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M4 19.5v-15A2.5 2.5 0 0 1 6.5 2H20v20H6.5a2.5 2.5 0 0 1-2.5-2.5Z"></path>
            <path d="M6 6h10"></path><path d="M6 10h10"></path>
          </svg>
          Materials
        </a>
        <a href="tasks.html" class="nav-link">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <polyline points="9 11 12 14 22 4"></polyline>
            <path d="M21 12v7a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11"></path>
          </svg>
          Tasks
        </a>
        <a href="schedule.html" class="nav-link">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <rect x="3" y="4" width="18" height="18" rx="2" ry="2"></rect>
            <line x1="16" y1="2" x2="16" y2="6"></line><line x1="8" y1="2" x2="8" y2="6"></line>
            <line x1="3" y1="10" x2="21" y2="10"></line>
          </svg>
          Schedule
        </a>
        <a href="timer.html" class="nav-link active">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <circle cx="12" cy="12" r="10"></circle>
            <polyline points="12 6 12 12 16 14"></polyline>
          </svg>
          Timer
        </a>
        <a href="progress.html" class="nav-link">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <line x1="18" y1="20" x2="18" y2="10"></line>
            <line x1="12" y1="20" x2="12" y2="4"></line>
            <line x1="6" y1="20" x2="6" y2="14"></line>
          </svg>
          Progress
        </a>
      </nav>

      <div class="sidebar-user">
        <div class="user-badge">
          <span class="user-avatar">AJ</span>
          <div class="user-details">
            <span class="user-name">Alex Johnson</span>
            <span class="user-role">Computer Science</span>
          </div>
        </div>
        <a href="/api/auth/logout" title="Logout" class="text-slate-400 hover:text-red-600 transition">
          <svg class="w-4 h-4" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"></path><polyline points="16 17 21 12 16 7"></polyline><line x1="21" y1="12" x2="9" y2="12"></line></svg>
        </a>
      </div>
    </aside>

    <!-- MAIN CONTENT -->
    <main class="app-main flex items-center justify-center">
      <div class="w-full max-w-lg bg-white border border-slate-200 rounded-3xl p-8 sm:p-10 shadow-sm text-center">
        
        <!-- Header -->
        <h1 class="text-xs font-bold uppercase tracking-widest text-slate-400 mb-6">CURRENT TASK</h1>

        <!-- Task Metadata Card -->
        <div class="mb-8 space-y-1">
          <h2 class="text-2xl font-black text-slate-900 tracking-tight" id="taskTitle">Logical Operators</h2>
          <p class="text-sm font-bold text-blue-600" id="taskCourse">Discrete Mathematics</p>
          <p class="text-xs font-semibold text-slate-400" id="taskPages">Pages 7–10</p>
        </div>

        <!-- Timer Display Box -->
        <div class="relative w-64 h-64 mx-auto mb-8 flex items-center justify-center">
          <!-- Circular SVG Progress Ring -->
          <svg class="w-full h-full transform -rotate-90" viewBox="0 0 100 100">
            <circle cx="50" cy="50" r="44" stroke="#f1f5f9" stroke-width="6" fill="transparent"/>
            <circle id="timerRing" cx="50" cy="50" r="44" stroke="#2563eb" stroke-width="6" stroke-dasharray="276.46" stroke-dashoffset="0" stroke-linecap="round" fill="transparent" class="transition-all duration-1000"/>
          </svg>

          <!-- Digital Time Text -->
          <div class="absolute inset-0 flex flex-col items-center justify-center">
            <span class="font-mono text-5xl font-extrabold text-slate-900 tracking-tight" id="timeDisplay">42:31</span>
            <span class="text-[11px] font-bold uppercase tracking-wider text-slate-400 mt-1" id="timerStateLabel">In Progress</span>
          </div>
        </div>

        <!-- Timer Control Action Buttons -->
        <div class="flex items-center justify-center gap-3 mb-8">
          <button id="btnStart" onclick="startTimer()" class="py-3 px-6 bg-blue-600 hover:bg-blue-700 text-white rounded-2xl text-sm font-bold shadow-md shadow-blue-500/20 transition flex items-center gap-2">
            <span>▶</span> Start
          </button>
          <button id="btnPause" onclick="pauseTimer()" class="hidden py-3 px-6 bg-slate-100 hover:bg-slate-200 text-slate-700 rounded-2xl text-sm font-bold transition flex items-center gap-2">
            <span>⏸</span> Pause
          </button>
          <button id="btnResume" onclick="resumeTimer()" class="hidden py-3 px-6 bg-blue-600 hover:bg-blue-700 text-white rounded-2xl text-sm font-bold transition flex items-center gap-2">
            <span>▶</span> Resume
          </button>
          <button id="btnFinish" onclick="finishTimer()" class="py-3 px-6 bg-emerald-600 hover:bg-emerald-700 text-white rounded-2xl text-sm font-bold shadow-md shadow-emerald-500/20 transition flex items-center gap-2">
            <span>✓</span> Finish
          </button>
        </div>

        <!-- Task Specs Details -->
        <div class="pt-6 border-t border-slate-100 flex items-center justify-between text-xs font-semibold text-slate-500">
          <span id="plannedMeta">Planned: 50 minutes</span>
          <span id="taskIdMeta">Task ID: #15</span>
        </div>

      </div>
    </main>
  </div>

  <script src="app-store.js"></script>
<script>
  let currentTaskId = 1;
  let plannedMinutes = 50;
  let totalSeconds = 50 * 60;
  let remainingSeconds = 50 * 60;
  let timerInterval = null;
  let isRunning = false;

  const circumference = 2 * Math.PI * 44;

  function getQueryParam(name) {
    const urlParams = new URLSearchParams(window.location.search);
    return urlParams.get(name);
  }

  function initTask() {
    const paramId = getQueryParam('task_id');

    if (paramId) {
      currentTaskId = Number(paramId);
    }

    const task = StudyGPS.getTaskById(currentTaskId);

    if (task) {
      document.getElementById('taskTitle').textContent = task.title;
      document.getElementById('taskCourse').textContent = task.course_name;
      document.getElementById('taskPages').textContent = task.pages;

      plannedMinutes = task.estimated_minutes || 50;
      totalSeconds = plannedMinutes * 60;
      remainingSeconds = totalSeconds;

      document.getElementById('plannedMeta').textContent =
        `Planned: ${plannedMinutes} minutes`;

      document.getElementById('taskIdMeta').textContent =
        `Task ID: #${task.id}`;
    }

    updateDisplay();

    // Timer starts only when user clicks Start
    isRunning = false;
  }

  function updateDisplay() {
    const m = Math.floor(remainingSeconds / 60);
    const s = remainingSeconds % 60;

    document.getElementById('timeDisplay').textContent =
      `${String(m).padStart(2, '0')}:${String(s).padStart(2, '0')}`;

    const progressFraction =
      (totalSeconds - remainingSeconds) / totalSeconds;

    const offset =
      circumference * (1 - progressFraction);

    document.getElementById('timerRing').style.strokeDashoffset =
      Math.max(0, offset);
  }

  function startInterval() {
    clearInterval(timerInterval);

    timerInterval = setInterval(() => {

      if (!isRunning) {
        return;
      }

      if (remainingSeconds > 0) {
        remainingSeconds--;
        updateDisplay();
      } else {
        clearInterval(timerInterval);
        isRunning = false;
        finishTimer();
      }

    }, 1000);
  }

  function startTimer() {
    isRunning = true;

    document.getElementById('btnStart').classList.add('hidden');
    document.getElementById('btnResume').classList.add('hidden');
    document.getElementById('btnPause').classList.remove('hidden');

    document.getElementById('timerStateLabel').textContent =
      'In Progress';

    startInterval();
  }

  function pauseTimer() {
    isRunning = false;

    clearInterval(timerInterval);

    document.getElementById('btnPause').classList.add('hidden');
    document.getElementById('btnResume').classList.remove('hidden');

    document.getElementById('timerStateLabel').textContent =
      'Paused';
  }

  function resumeTimer() {
    isRunning = true;

    document.getElementById('btnResume').classList.add('hidden');
    document.getElementById('btnPause').classList.remove('hidden');

    document.getElementById('timerStateLabel').textContent =
      'In Progress';

    startInterval();
  }

  async function finishTimer() {
    clearInterval(timerInterval);
    isRunning = false;

    const elapsedSeconds =
      totalSeconds - remainingSeconds;

    const actualMinutes = Math.max(
      1,
      Math.round(elapsedSeconds / 60)
    );

    console.log("TIMER DEBUG");
    console.log("Planned minutes:", plannedMinutes);
    console.log("Total seconds:", totalSeconds);
    console.log("Remaining seconds:", remainingSeconds);
    console.log("Elapsed seconds:", elapsedSeconds);
    console.log("Actual minutes:", actualMinutes);

    try {
      const response = await fetch('http://localhost:3000/api/study-sessions', {
        method: 'POST',
        headers: {
          'Content-Type': 'application/json'
        },
        body: JSON.stringify({
          task_id: currentTaskId,
          planned_minutes: plannedMinutes,
          actual_seconds: elapsedSeconds,
          start_time: null,
          end_time: new Date().toISOString(),
          completed: 1
        })
      });

      const data = await response.json();

      if (!response.ok || !data.success) {
        throw new Error(
          data.error || 'Failed to save study session'
        );
      }

      console.log(
        'Study session saved to database:',
        data
      );

      window.location.href =
        'progress.html?session_completed=1';

    } catch (error) {

      console.error(
        'Failed to save study session:',
        error
      );

      alert(
        'Could not save your study session. Please try again.'
      );
    }
  }

  document.addEventListener(
    'DOMContentLoaded',
    initTask
  );
</script>
</body>
</html>
