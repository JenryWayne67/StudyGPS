<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>StudyGPS - Welcome</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0,0" />
</head>
<body class="bg-[#f8f9fa] text-slate-800 flex flex-col items-center justify-center min-h-screen p-4">

    <!-- Header Title -->
    <div class="text-center mb-8">
        <h1 class="text-2xl font-bold text-slate-900">Welcome to StudyGPS</h1>
        <p class="text-xs text-slate-500 mt-1">Let's start by getting to know you better.</p>
    </div>

    
    <div class="flex items-center gap-4 mb-8 text-xs font-medium text-slate-400">
        <div id="badge-1" class="flex items-center gap-1.5 text-blue-600 font-bold">
            <span class="w-6 h-6 rounded-full bg-blue-600 text-white flex items-center justify-center text-[10px]">1</span>
            <span>Personal</span>
        </div>
        <div class="w-8 h-[2px] bg-slate-200"></div>
        <div id="badge-2" class="flex items-center gap-1.5">
            <span class="w-6 h-6 rounded-full bg-slate-200 text-slate-600 flex items-center justify-center text-[10px]">2</span>
            <span>Academic</span>
        </div>
        <div class="w-8 h-[2px] bg-slate-200"></div>
        <div id="badge-3" class="flex items-center gap-1.5">
            <span class="w-6 h-6 rounded-full bg-slate-200 text-slate-600 flex items-center justify-center text-[10px]">3</span>
            <span>Goals</span>
        </div>
    </div>

    <!-- Card Form Container -->
    <div class="bg-white p-8 rounded-2xl shadow-sm border border-slate-100 w-full max-w-md">

        <!-- STEP 1: Personal Profile -->
        <div id="step-1" class="step-content space-y-4">
            <h2 class="text-base font-bold text-slate-900">Personal Profile</h2>
            <p class="text-xs text-slate-400 mb-4">Tell us a bit about yourself to get started.</p>

            <div>
                <label class="block text-xs font-semibold text-slate-600 mb-1">Full Name</label>
                <input type="text" placeholder="John Doe" class="w-full text-xs p-3 bg-slate-50 border border-slate-200 rounded-xl focus:outline-none focus:border-blue-500">
            </div>
            <div>
                <label class="block text-xs font-semibold text-slate-600 mb-1">Age</label>
                <input type="number" placeholder="20" class="w-full text-xs p-3 bg-slate-50 border border-slate-200 rounded-xl focus:outline-none focus:border-blue-500">
            </div>
            <button onclick="nextStep()" class="w-full bg-[#0b3b60] text-white text-xs font-semibold py-3 rounded-xl hover:opacity-90 mt-4">
                Continue →
            </button>
        </div>

        <!-- STEP 2: Academic Profile -->
        <div id="step-2" class="step-content space-y-4 hidden">
            <h2 class="text-base font-bold text-slate-900">Academic Profile</h2>
            <p class="text-xs text-slate-400 mb-4">What are you currently studying?</p>

            <div>
                <label class="block text-xs font-semibold text-slate-600 mb-1">Major / Subject</label>
                <input type="text" placeholder="Computer Science" class="w-full text-xs p-3 bg-slate-50 border border-slate-200 rounded-xl focus:outline-none focus:border-blue-500">
            </div>
            <div class="flex gap-2 pt-2">
                <button onclick="prevStep()" class="w-1/3 bg-slate-100 text-slate-600 text-xs font-semibold py-3 rounded-xl">Back</button>
                <button onclick="nextStep()" class="w-2/3 bg-[#0b3b60] text-white text-xs font-semibold py-3 rounded-xl hover:opacity-90">Continue →</button>
            </div>
        </div><!-- STEP 3: Goals & Finish -->
        <div id="step-3" class="step-content space-y-4 hidden">
            <h2 class="text-base font-bold text-slate-900">Set Your Goals</h2>
            <p class="text-xs text-slate-400 mb-4">Almost there! What's your primary goal?</p>

            <div>
                <label class="block text-xs font-semibold text-slate-600 mb-1">Study Hours / Day</label>
                <input type="text" placeholder="3 hours" class="w-full text-xs p-3 bg-slate-50 border border-slate-200 rounded-xl focus:outline-none focus:border-blue-500">
            </div>
            <div class="flex gap-2 pt-2">
                <button onclick="prevStep()" class="w-1/3 bg-slate-100 text-slate-600 text-xs font-semibold py-3 rounded-xl">Back</button>
                <button onclick="finishOnboarding()" class="w-2/3 bg-emerald-600 text-white text-xs font-semibold py-3 rounded-xl hover:opacity-90">Finish & Go to Dashboard</button>
            </div>
        </div>

    </div>

    </body>
    </html>
