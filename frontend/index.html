<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>StudyGPS — Your Personal Study Navigator</title>
  <link rel="icon" type="image/png" href="images/favicon-32.png">
  <link rel="apple-touch-icon" href="images/apple-touch-icon.png">
  <link rel="stylesheet" href="common.css">
  <link rel="stylesheet" href="tailwind.css">
  <script src="javascript/theme.js"></script>
</head>
<body class="bg-slate-50 min-h-screen flex items-center justify-center p-4 font-sans text-slate-900">

  <div class="w-full max-w-md bg-white border border-slate-200 rounded-3xl p-8 sm:p-10 shadow-sm text-center">
    <!-- Brand Compass Logo -->
    <div class="brand-logo w-16 h-16 rounded-2xl mx-auto mb-5 shadow-lg shadow-slate-900/10">
      <img src="images/logo-light-128.png" alt="StudyGPS" class="logo-img logo-light">
      <img src="images/logo-dark-128.png" alt="StudyGPS" class="logo-img logo-dark">
    </div>

    <h1 class="text-2xl font-extrabold text-slate-900 tracking-tight">StudyGPS</h1>
    <p class="text-sm font-medium text-slate-500 mt-1 mb-8">Your Personal Study Navigator</p>

    <!-- Real email/password sign-in lives on login.html - this used to
         be two "Quick Access" buttons that called a mock StudyGPS.setUser()
         (app-store.js) and jumped straight to interview.html/dashboard.html
         without ever creating a real session, so those pages' own
         GET /api/auth/me check would just bounce back to /login anyway.
         This links to the real thing instead of faking it. -->
    <a href="login.html" class="w-full flex items-center justify-center py-3 px-4 bg-blue-600 hover:bg-blue-700 text-white rounded-xl text-sm font-semibold shadow-sm transition">
      Continue with Email
    </a>

    <div class="mt-8 pt-6 border-t border-slate-100">
      <p class="text-xs text-slate-400 font-medium">New here? Tap above to get set up.</p>
    </div>
  </div>

</body>
</html>
