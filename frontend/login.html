<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>StudyGPS — Login</title>
  <link rel="stylesheet" href="common.css">
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="javascript/theme.js"></script>
</head>
<body class="bg-slate-50 min-h-screen flex items-center justify-center p-4 font-sans text-slate-900">

  <div class="w-full max-w-md bg-white border border-slate-200 rounded-3xl p-8 sm:p-10 shadow-sm">
    <!-- Brand Compass Logo -->
    <div class="w-14 h-14 rounded-2xl bg-gradient-to-tr from-blue-600 to-indigo-500 text-white flex items-center justify-center mx-auto mb-5 shadow-lg shadow-blue-500/20">
      <svg class="w-7 h-7" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
        <circle cx="12" cy="12" r="10"></circle>
        <polygon points="16.24 7.76 14.12 14.12 7.76 16.24 9.88 9.88 16.24 7.76"></polygon>
      </svg>
    </div>

    <h1 class="text-2xl font-extrabold text-slate-900 tracking-tight text-center">StudyGPS</h1>
    <p class="text-sm font-medium text-slate-500 mt-1 mb-8 text-center">Your Personal Study Navigator</p>

    <!-- Google OAuth Button -->
    <a href="/api/auth/google" target="_top" class="w-full flex items-center justify-center gap-3 py-3 px-4 bg-white border border-slate-200 hover:border-slate-300 hover:bg-slate-50 rounded-xl text-sm font-semibold text-slate-700 shadow-sm transition">
      <svg class="w-4 h-4" viewBox="0 0 24 24">
        <path fill="#4285F4" d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z"/>
        <path fill="#34A853" d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z"/>
        <path fill="#FBBC05" d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.06H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.94l2.85-2.22.81-.63z"/>
        <path fill="#EA4335" d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.06l3.66 2.84c.87-2.6 3.3-4.52 6.16-4.52z"/>
      </svg>
      Continue with Google
    </a>

    <div class="flex items-center gap-3 my-6">
      <div class="flex-1 h-px bg-slate-200"></div>
      <span class="text-xs font-medium text-slate-400 uppercase tracking-wide">or</span>
      <div class="flex-1 h-px bg-slate-200"></div>
    </div>

    <!-- Mode toggle -->
    <div class="flex bg-slate-100 rounded-xl p-1 mb-6 text-sm font-semibold">
      <button id="tab-login" onclick="setMode('login')" class="flex-1 py-2 rounded-lg transition">Log In</button>
      <button id="tab-signup" onclick="setMode('signup')" class="flex-1 py-2 rounded-lg transition">Sign Up</button>
    </div>

    <div id="form-error" class="hidden mb-4 text-xs font-medium text-red-600 bg-red-50 border border-red-100 rounded-xl px-4 py-2.5"></div>

    <form id="auth-form" class="space-y-3" onsubmit="handleSubmit(event)">
      <div id="name-field" class="hidden">
        <label class="block text-xs font-semibold text-slate-500 mb-1">Full Name</label>
        <input type="text" id="field-name" autocomplete="name" class="w-full px-4 py-2.5 rounded-xl border border-slate-200 text-sm focus:outline-none focus:ring-2 focus:ring-blue-500/40 focus:border-blue-400" placeholder="Alex Johnson">
      </div>
      <div>
        <label class="block text-xs font-semibold text-slate-500 mb-1">Email</label>
        <input type="email" id="field-email" autocomplete="email" required class="w-full px-4 py-2.5 rounded-xl border border-slate-200 text-sm focus:outline-none focus:ring-2 focus:ring-blue-500/40 focus:border-blue-400" placeholder="you@university.edu">
      </div>
      <div>
        <label class="block text-xs font-semibold text-slate-500 mb-1">Password</label>
        <input type="password" id="field-password" autocomplete="current-password" required minlength="8" class="w-full px-4 py-2.5 rounded-xl border border-slate-200 text-sm focus:outline-none focus:ring-2 focus:ring-blue-500/40 focus:border-blue-400" placeholder="At least 8 characters">
      </div>

      <button type="submit" id="submit-btn" class="w-full py-3 px-4 bg-blue-600 hover:bg-blue-700 text-white rounded-xl text-sm font-semibold shadow-sm transition disabled:opacity-60 disabled:cursor-not-allowed">
        Log In
      </button>
    </form>

    <div class="mt-8 pt-6 border-t border-slate-100">
      <p class="text-xs text-slate-400 font-medium text-center">Welcome back! Ready to map your study journey?</p>
    </div>
  </div>

  <script>
    let mode = 'login';

    function setMode(next) {
      mode = next;
      const isLogin = mode === 'login';

      document.getElementById('tab-login').className =
        'flex-1 py-2 rounded-lg transition ' + (isLogin ? 'bg-white shadow-sm text-slate-900' : 'text-slate-500');
      document.getElementById('tab-signup').className =
        'flex-1 py-2 rounded-lg transition ' + (!isLogin ? 'bg-white shadow-sm text-slate-900' : 'text-slate-500');

      document.getElementById('name-field').classList.toggle('hidden', isLogin);
      document.getElementById('field-name').required = !isLogin;
      document.getElementById('field-password').autocomplete = isLogin ? 'current-password' : 'new-password';
      document.getElementById('submit-btn').textContent = isLogin ? 'Log In' : 'Create Account';
      hideError();
    }

    function showError(message) {
      const el = document.getElementById('form-error');
      el.textContent = message;
      el.classList.remove('hidden');
    }

    function hideError() {
      document.getElementById('form-error').classList.add('hidden');
    }

    async function handleSubmit(event) {
      event.preventDefault();
      hideError();

      const email = document.getElementById('field-email').value.trim();
      const password = document.getElementById('field-password').value;
      const name = document.getElementById('field-name').value.trim();
      const endpoint = mode === 'login' ? '/api/auth/login' : '/api/auth/signup';
      const body = mode === 'login' ? { email, password } : { name, email, password };

      const submitBtn = document.getElementById('submit-btn');
      submitBtn.disabled = true;
      const originalLabel = submitBtn.textContent;
      submitBtn.textContent = mode === 'login' ? 'Logging in…' : 'Creating account…';

      try {
        const res = await fetch(endpoint, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(body)
        });
        const data = await res.json().catch(() => ({}));

        if (!res.ok) {
          showError(data.error || 'Something went wrong. Please try again.');
          submitBtn.disabled = false;
          submitBtn.textContent = originalLabel;
          return;
        }

        window.location.href = data.needsInterview ? '/interview.html' : '/dashboard';
      } catch (err) {
        showError('Could not reach the server. Please check your connection and try again.');
        submitBtn.disabled = false;
        submitBtn.textContent = originalLabel;
      }
    }

    setMode('login');
  </script>
</body>
</html>
